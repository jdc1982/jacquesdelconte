<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Jacques del Conte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0f0ee;--ink:#1a1a18;--soft:#6f6c66;--line:rgba(26,26,24,0.12);--red:#c0392b;--green:#27ae60;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Jost',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;-webkit-font-smoothing:antialiased;min-height:100vh}
input,select,textarea,button{font-family:var(--sans)}
#login{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-box{background:#fff;border:1px solid var(--line);padding:48px;max-width:420px;width:100%;text-align:center}
.login-box h1{font-family:var(--serif);font-weight:300;font-size:2rem;margin-bottom:8px}
.login-box p{color:var(--soft);font-size:13px;margin-bottom:28px}
.login-box input{width:100%;border:1px solid var(--line);padding:12px 14px;font-size:14px;margin-bottom:14px;background:var(--bg);outline:none;color:var(--ink)}
.login-box input:focus{border-color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 24px;background:var(--ink);color:#fff;font-size:11px;letter-spacing:.18em;text-transform:uppercase;border:none;cursor:pointer;font-weight:400;transition:opacity .2s}
.btn:hover{opacity:.8}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.secondary{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.secondary:hover{background:var(--ink);color:#fff}
.btn.danger{background:var(--red)}
.btn.green{background:var(--green)}
.btn.small{padding:7px 14px;font-size:10px}
#app{display:none;min-height:100vh}
.topbar{position:sticky;top:0;z-index:100;background:rgba(240,240,238,0.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px;height:60px}
.topbar .brand{font-family:var(--serif);font-size:18px}
.topbar .actions{display:flex;align-items:center;gap:12px}
.status{font-size:11px;letter-spacing:.1em;color:var(--soft)}
.status.saving{color:orange}.status.saved{color:var(--green)}.status.error{color:var(--red)}
#pages-view{padding:40px 32px}
.pages-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
.pages-header h2{font-family:var(--serif);font-weight:300;font-size:1.8rem}
.pages-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.page-card{background:#fff;border:1px solid var(--line);padding:20px 22px;cursor:pointer;transition:border-color .2s,box-shadow .2s}
.page-card:hover{border-color:var(--ink);box-shadow:0 2px 12px rgba(0,0,0,0.06)}
.page-card h3{font-family:var(--serif);font-weight:400;font-size:1.2rem;margin-bottom:6px}
.page-card p{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
.panel{background:#fff;border:1px solid var(--line);padding:28px;margin-top:24px;max-width:640px}
.panel h3{font-family:var(--serif);font-weight:400;font-size:1.3rem;margin-bottom:20px}
.field{margin-bottom:16px}
.field label{display:block;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--soft);margin-bottom:7px}
.field input,.field select{width:100%;border:1px solid var(--line);padding:10px 12px;background:var(--bg);outline:none;font-size:14px;color:var(--ink)}
.field input:focus,.field select:focus{border-color:var(--ink)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.panel-actions{display:flex;gap:10px;margin-top:4px}
.err-msg{color:var(--red);font-size:12px;margin-top:10px;display:none}
#editor-view{display:none;padding:32px}
.editor-header{display:flex;align-items:center;gap:16px;margin-bottom:28px;flex-wrap:wrap}
.editor-header h2{font-family:var(--serif);font-weight:300;font-size:1.8rem}
.editor-header .spacer{flex:1}
.project-list{display:flex;flex-direction:column;gap:14px}
.project-card{background:#fff;border:1px solid var(--line)}
.project-head{display:flex;align-items:center;gap:12px;padding:15px 20px;cursor:pointer;user-select:none;border-bottom:1px solid transparent;transition:background .2s}
.project-head:hover{background:rgba(26,26,24,0.03)}
.project-head.open{border-bottom:1px solid var(--line)}
.project-num{font-size:11px;letter-spacing:.12em;color:var(--soft);min-width:26px}
.project-title-text{font-family:var(--serif);font-size:1.1rem;font-weight:400;flex:1}
.chevron{color:var(--soft);transition:transform .3s;font-size:13px}
.project-head.open .chevron{transform:rotate(180deg)}
.project-body{display:none;padding:22px 22px 26px}
.project-body.open{display:block}
.section-label{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--soft);margin:20px 0 10px;display:flex;align-items:center;justify-content:space-between}
.credit-row,.film-row{display:grid;gap:8px;margin-bottom:8px;align-items:center}
.credit-row{grid-template-columns:1fr 1fr 30px}
.film-row{grid-template-columns:88px 1fr 1fr 30px}
.credit-row input,.film-row input,.film-row select{border:1px solid var(--line);padding:8px 10px;background:var(--bg);outline:none;font-size:13px;color:var(--ink);width:100%}
.credit-row input:focus,.film-row input:focus,.film-row select:focus{border-color:var(--ink)}
.rm{background:none;border:none;color:var(--soft);cursor:pointer;font-size:18px;line-height:1;padding:4px;transition:color .2s}
.rm:hover{color:var(--red)}
.project-actions{display:flex;gap:8px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.toast{position:fixed;bottom:24px;right:24px;background:var(--ink);color:#fff;padding:12px 20px;font-size:12px;letter-spacing:.08em;opacity:0;transition:opacity .4s;pointer-events:none;z-index:9999;max-width:340px}
.toast.show{opacity:1}
.toast.err{background:var(--red)}
.loading{text-align:center;padding:60px;color:var(--soft);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
</style>
</head>
<body>
<div id="login">
  <div class="login-box">
    <h1>Jacques del Conte</h1>
    <p>Enter your GitHub token to manage the site</p>
    <input type="password" id="tokenInput" placeholder="ghp_xxxxxxxxxxxx" autocomplete="off">
    <button class="btn" style="width:100%" id="signInBtn" onclick="doLogin()">Sign In</button>
    <p id="loginErr" style="color:var(--red);font-size:12px;margin-top:12px;display:none"></p>
  </div>
</div>
<div id="app">
  <div class="topbar">
    <span class="brand">Admin</span>
    <div class="actions">
      <span class="status" id="statusMsg"></span>
      <button class="btn secondary small" id="backBtn" onclick="showPages()" style="display:none">← Pages</button>
      <button class="btn small" id="saveBtn" onclick="saveCurrentPage()" style="display:none">Save & Deploy</button>
      <button class="btn secondary small" onclick="doLogout()">Sign Out</button>
    </div>
  </div>
  <div id="pages-view">
    <div class="pages-header">
      <h2>Client Pages</h2>
      <button class="btn small green" onclick="toggleNewClientForm()">+ New Client</button>
    </div>
    <div class="pages-grid" id="pagesGrid"></div>
    <div class="panel" id="newClientPanel" style="display:none">
      <h3>New Client Page</h3>
      <div class="field-row">
        <div class="field"><label>Client Name</label><input type="text" id="ncLabel" placeholder="e.g. Chanel" oninput="autoSlug()"></div>
        <div class="field"><label>URL slug (auto)</label><input type="text" id="ncSlug" placeholder="e.g. chanel"></div>
      </div>
      <div class="field"><label>Subtitle (optional)</label><input type="text" id="ncSub" placeholder="e.g. N5 Campaign"></div>
      <div class="field"><label>Thumbnail URL (optional — adds to homepage grid)</label><input type="text" id="ncThumb" placeholder="https://..."></div>
      <div class="field-row">
        <div class="field"><label>Previous client name</label><input type="text" id="ncPrev" placeholder="e.g. Crown Royal"></div>
        <div class="field"><label>Next client name</label><input type="text" id="ncNext" placeholder="e.g. Louis Vuitton"></div>
      </div>
      <div class="panel-actions">
        <button class="btn small green" onclick="createNewClient()">Create Page</button>
        <button class="btn secondary small" onclick="toggleNewClientForm()">Cancel</button>
      </div>
      <p class="err-msg" id="ncErr"></p>
    </div>
  </div>
  <div id="editor-view">
    <div class="editor-header">
      <h2 id="editorTitle"></h2>
      <div class="spacer"></div>
      <button class="btn small green" onclick="addProject()">+ Add Project</button>
    </div>
    <div class="project-list" id="projectList"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const OWNER='jdc1982',REPO='jacquesdelconte';
const BASE=`https://api.github.com/repos/${OWNER}/${REPO}`;
let TOKEN='',currentFile='',currentHTML='',currentSHA='',projects=[];

const PAGES=[
  {file:'lv.html',label:'Louis Vuitton'},{file:'dior.html',label:'Dior'},
  {file:'cartier.html',label:'Cartier'},{file:'gucci.html',label:'Gucci'},
  {file:'mugler.html',label:'Mugler'},{file:'armani.html',label:'Armani Beauty'},
  {file:'zegna.html',label:'Zegna'},{file:'pandora.html',label:'Pandora'},
  {file:'lancome.html',label:'Lancome'},{file:'dolce.html',label:'Dolce & Gabbana'},
  {file:'nars.html',label:'Nars'},{file:'boss.html',label:'Hugo Boss'},
  {file:'zara.html',label:'Zara'},{file:'zarahome.html',label:'Zara Home'},
  {file:'zarabeauty.html',label:'Zara Beauty'},{file:'crownroyal.html',label:'Crown Royal'},
];

async function doLogin(){
  const t=document.getElementById('tokenInput').value.trim();
  if(!t)return;
  const btn=document.getElementById('signInBtn');
  btn.textContent='Signing in...';btn.disabled=true;
  const errEl=document.getElementById('loginErr');
  errEl.style.display='none';
  try{
    const r=await fetch(BASE,{headers:{'Authorization':`token ${t}`,'Accept':'application/vnd.github.v3+json'}});
    const d=await r.json();
    if(r.ok&&d.full_name){
      TOKEN=t;localStorage.setItem('jdc_token',t);
      document.getElementById('login').style.display='none';
      document.getElementById('app').style.display='block';
      showPages();
    } else {
      errEl.textContent=d.message||'Login failed ('+r.status+')';errEl.style.display='block';
    }
  }catch(e){errEl.textContent='Network error: '+e.message;errEl.style.display='block';}
  btn.textContent='Sign In';btn.disabled=false;
}

function doLogout(){
  TOKEN='';localStorage.removeItem('jdc_token');
  document.getElementById('login').style.display='flex';
  document.getElementById('app').style.display='none';
}

async function ghGet(path){
  const r=await fetch(BASE+path,{headers:{'Authorization':`token ${TOKEN}`,'Accept':'application/vnd.github.v3+json'}});
  if(!r.ok) throw new Error('GitHub '+r.status);
  return r.json();
}
async function ghPut(path,body){
  const r=await fetch(BASE+path,{method:'PUT',headers:{'Authorization':`token ${TOKEN}`,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},body:JSON.stringify(body)});
  return r.json();
}

function showPages(){
  document.getElementById('pages-view').style.display='block';
  document.getElementById('editor-view').style.display='none';
  document.getElementById('saveBtn').style.display='none';
  document.getElementById('backBtn').style.display='none';
  setStatus('');
  document.getElementById('pagesGrid').innerHTML=PAGES.map(p=>
    `<div class="page-card" onclick="openPage('${p.file}','${he(p.label)}')">
      <h3>${p.label}</h3><p>${p.file}</p>
    </div>`).join('');
}

function toggleNewClientForm(){
  const panel=document.getElementById('newClientPanel');
  panel.style.display=panel.style.display==='none'?'block':'none';
}
function autoSlug(){
  document.getElementById('ncSlug').value=
    document.getElementById('ncLabel').value.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
}

function mkTemplate(label,slug,sub,prev,next){
  const ps=prev.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  const ns=next.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  const sh=sub?`<div class="sub">${sub}</div>`:'';
  return `<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">\n<title>${label} — Jacques del Conte</title>\n<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">\n<link rel="stylesheet" href="style.css">\n</head>\n<body class="client-page">\n<header><div class="bar"><a href="index.html" class="back">\u2190 All Work</a><a href="index.html" class="home">Jacques del Conte</a><div class="links"><a href="mailto:jacques@jacquesdelconte.com">Contact</a><a href="https://www.linkedin.com/in/jacquesdelconte/" target="_blank" rel="noopener">LinkedIn</a></div></div></header>\n<div class="m-progress" id="mProgress"></div>\n<div class="m-story-wrap" id="mStory"></div>\n<div class="m-nav-hint" id="mNavHint"><span>Swipe</span><span class="arr">\u2192</span></div>\n<main id="projects-desktop">\n  <section class="client-head wrap"><div class="eyebrow">Post Production</div><h1>${label}</h1>${sh}</section>\n  <nav class="index wrap"><div class="label">Projects</div><ul id="indexList"></ul></nav>\n  <div id="projects"></div>\n  <section class="pager wrap"><div class="pager-inner">\n    <a href="${ps}.html" class="prev"><div class="lbl">Previous</div><div class="nm">${prev}</div></a>\n    <a href="${ns}.html" class="next"><div class="lbl">Next</div><div class="nm">${next} \u2192</div></a>\n  </div></section>\n</main>\n<footer class="wrap"><a class="mail" href="mailto:jacques@jacquesdelconte.com">jacques@jacquesdelconte.com</a><div class="copy">\u00a9 <span id="year"></span> Jacques del Conte \u2014 Executive Producer &amp; Post Production Consultant</div></footer>\n<script src="client.js"><\/script>\n<script>\nconst PROJECTS=[\n  {id:'${slug}-1',title:'${label}',credits:[['EP of Post','Jacques del Conte']],films:[{provider:'vimeo',id:'',label:'',poster:''}],layout:'single'}\n];\ninitClientPage(PROJECTS);\n<\/script>\n</body></html>`;
}

async function createNewClient(){
  const label=document.getElementById('ncLabel').value.trim();
  const slug=document.getElementById('ncSlug').value.trim();
  const sub=document.getElementById('ncSub').value.trim();
  const thumb=document.getElementById('ncThumb').value.trim();
  const prev=document.getElementById('ncPrev').value.trim();
  const next=document.getElementById('ncNext').value.trim();
  const errEl=document.getElementById('ncErr');
  errEl.style.display='none';
  if(!label||!slug){errEl.textContent='Name and slug required';errEl.style.display='block';return;}
  if(!prev||!next){errEl.textContent='Previous and next client names required';errEl.style.display='block';return;}
  setStatus('Creating...','saving');
  try{
    const html=mkTemplate(label,slug,sub,prev,next);
    const enc=btoa(unescape(encodeURIComponent(html)));
    const r=await fetch(`${BASE}/contents/${slug}.html`,{method:'PUT',headers:{'Authorization':`token ${TOKEN}`,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},body:JSON.stringify({message:`Create ${slug}.html`,content:enc})});
    const d=await r.json();
    if(!d.content) throw new Error(d.message||'Failed to create file');
    if(thumb){
      const ir=await fetch(`${BASE}/contents/index.html`,{headers:{'Authorization':`token ${TOKEN}`,'Accept':'application/vnd.github.v3+json'}});
      const id=await ir.json();
      let ihtml=decodeURIComponent(escape(atob(id.content.replace(/\n/g,''))));
      const tile=`      <a class="tile reveal" href="${slug}.html"><img src="${thumb}" alt="${label}"><div class="cap"><span>${label}</span></div></a>\n`;
      ihtml=ihtml.replace('    </div>\n  </section>\n  <section class="home-foot',tile+'    </div>\n  </section>\n  <section class="home-foot');
      await fetch(`${BASE}/contents/index.html`,{method:'PUT',headers:{'Authorization':`token ${TOKEN}`,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},body:JSON.stringify({message:`Add ${label} to homepage`,content:btoa(unescape(encodeURIComponent(ihtml))),sha:id.sha})});
    }
    PAGES.push({file:`${slug}.html`,label});
    setStatus('Created!','saved');
    toast(`${label} created${thumb?' + added to homepage':''}`);
    toggleNewClientForm();
    document.getElementById('pagesGrid').innerHTML=PAGES.map(p=>`<div class="page-card" onclick="openPage('${p.file}','${he(p.label)}')"><h3>${p.label}</h3><p>${p.file}</p></div>`).join('');
    setTimeout(()=>openPage(`${slug}.html`,label),600);
  }catch(e){setStatus('Error','error');errEl.textContent='Error: '+e.message;errEl.style.display='block';}
}

async function openPage(file,label){
  document.getElementById('pages-view').style.display='none';
  document.getElementById('editor-view').style.display='block';
  document.getElementById('saveBtn').style.display='inline-flex';
  document.getElementById('backBtn').style.display='inline-flex';
  document.getElementById('editorTitle').textContent=label;
  document.getElementById('projectList').innerHTML='<div class="loading">Loading...</div>';
  setStatus('');currentFile=file;
  try{
    const res=await ghGet(`/contents/${file}`);
    currentSHA=res.sha;
    currentHTML=decodeURIComponent(escape(atob(res.content.replace(/\n/g,''))));
    projects=parseProjects(currentHTML);
    renderProjects();
  }catch(e){document.getElementById('projectList').innerHTML=`<div class="loading" style="color:var(--red)">Error: ${e.message}</div>`;}
}

function parseProjects(html){
  const m=html.match(/const PROJECTS=(\[[\s\S]*?\]);\s*\ninitClientPage/);
  if(!m) throw new Error('Could not find PROJECTS array');
  return (new Function('return '+m[1]))();
}

function serializeProjects(ps){
  const sf=f=>`{provider:'${esc(f.provider)}',id:'${esc(f.id)}',label:'${esc(f.label||'')}',poster:'${esc(f.poster||'')}'}`;
  const sc=c=>`['${esc(c[0])}','${esc(c[1])}']`;
  const sp=p=>{
    const hero=p.heroFilm?`,heroFilm:${sf(p.heroFilm)}`:'';
    return `{id:'${esc(p.id)}',title:'${esc(p.title)}',credits:[${p.credits.map(sc).join(',')}]${hero},films:[${p.films.map(sf).join(',')}],layout:'${esc(p.layout||'single')}'}`;
  };
  return '[\n  '+ps.map(sp).join(',\n  ')+'\n]';
}
function esc(s){return String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
function he(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}

function renderProjects(){
  const list=document.getElementById('projectList');
  if(!projects.length){list.innerHTML='<div class="loading">No projects</div>';return;}
  list.innerHTML=projects.map((p,pi)=>cardHTML(p,pi)).join('');
}

function cardHTML(p,pi){
  const credits=(p.credits||[]).map((c,ci)=>`
    <div class="credit-row">
      <input value="${he(c[0])}" placeholder="Role" onchange="projects[${pi}].credits[${ci}][0]=this.value">
      <input value="${he(c[1])}" placeholder="Name" onchange="projects[${pi}].credits[${ci}][1]=this.value">
      <button class="rm" onclick="rmCredit(${pi},${ci})">x</button>
    </div>`).join('');
  const heroHtml=p.heroFilm?`
    <div class="section-label">Hero Film</div>
    <div class="film-row">
      <select onchange="projects[${pi}].heroFilm.provider=this.value">
        <option value="vimeo" ${p.heroFilm.provider==='vimeo'?'selected':''}>Vimeo</option>
        <option value="youtube" ${p.heroFilm.provider==='youtube'?'selected':''}>YouTube</option>
      </select>
      <input value="${he(p.heroFilm.id)}" placeholder="Video ID" onchange="projects[${pi}].heroFilm.id=this.value">
      <input value="${he(p.heroFilm.label||'')}" placeholder="Label" onchange="projects[${pi}].heroFilm.label=this.value">
      <button class="rm" onclick="rmHero(${pi})">x</button>
    </div>`:`
    <div class="section-label">Hero Film <button class="btn secondary small" style="text-transform:none;letter-spacing:0;padding:3px 10px;font-size:11px" onclick="addHero(${pi})">+ Add Hero</button></div>`;
  const films=(p.films||[]).map((f,fi)=>`
    <div class="film-row">
      <select onchange="projects[${pi}].films[${fi}].provider=this.value">
        <option value="vimeo" ${f.provider==='vimeo'?'selected':''}>Vimeo</option>
        <option value="youtube" ${f.provider==='youtube'?'selected':''}>YouTube</option>
      </select>
      <input value="${he(f.id)}" placeholder="Video ID" onchange="projects[${pi}].films[${fi}].id=this.value">
      <input value="${he(f.label||'')}" placeholder="Label" onchange="projects[${pi}].films[${fi}].label=this.value">
      <button class="rm" onclick="rmFilm(${pi},${fi})">x</button>
    </div>`).join('');
  return `<div class="project-card" id="pc${pi}">
    <div class="project-head" onclick="toggleCard(${pi})">
      <span class="project-num">${String(pi+1).padStart(2,'0')}</span>
      <span class="project-title-text">${he(p.title)}</span>
      <span class="chevron">v</span>
    </div>
    <div class="project-body" id="pb${pi}">
      <div class="field" style="margin-bottom:16px">
        <label>Title</label>
        <input type="text" value="${he(p.title)}" onchange="projects[${pi}].title=this.value;document.querySelector('#pc${pi} .project-title-text').textContent=this.value">
      </div>
      <div class="section-label">Credits <button class="btn secondary small" style="text-transform:none;letter-spacing:0;padding:3px 10px;font-size:11px" onclick="addCredit(${pi})">+ Add</button></div>
      <div id="cl${pi}">${credits}</div>
      ${heroHtml}
      <div class="section-label">Films <button class="btn secondary small" style="text-transform:none;letter-spacing:0;padding:3px 10px;font-size:11px" onclick="addFilm(${pi})">+ Add</button></div>
      <div id="fl${pi}">${films}</div>
      <div class="project-actions">
        <button class="btn secondary small" onclick="moveUp(${pi})" ${pi===0?'disabled':''}>Up</button>
        <button class="btn secondary small" onclick="moveDown(${pi})" ${pi===projects.length-1?'disabled':''}>Down</button>
        <button class="btn danger small" onclick="rmProject(${pi})">Remove</button>
      </div>
    </div>
  </div>`;
}

function toggleCard(pi){document.querySelector(`#pc${pi} .project-head`).classList.toggle('open');document.getElementById(`pb${pi}`).classList.toggle('open');}
function openCard(pi){document.querySelector(`#pc${pi} .project-head`).classList.add('open');document.getElementById(`pb${pi}`).classList.add('open');}
function refreshCard(pi){const was=document.getElementById(`pb${pi}`).classList.contains('open');document.getElementById(`pc${pi}`).outerHTML=cardHTML(projects[pi],pi);if(was)openCard(pi);}
function addCredit(pi){projects[pi].credits.push(['','']);refreshCard(pi);openCard(pi);}
function rmCredit(pi,ci){projects[pi].credits.splice(ci,1);refreshCard(pi);openCard(pi);}
function addFilm(pi){projects[pi].films.push({provider:'vimeo',id:'',label:'',poster:''});refreshCard(pi);openCard(pi);}
function rmFilm(pi,fi){projects[pi].films.splice(fi,1);refreshCard(pi);openCard(pi);}
function addHero(pi){projects[pi].heroFilm={provider:'vimeo',id:'',label:'',poster:''};refreshCard(pi);openCard(pi);}
function rmHero(pi){delete projects[pi].heroFilm;refreshCard(pi);openCard(pi);}
function moveUp(pi){if(pi===0)return;[projects[pi-1],projects[pi]]=[projects[pi],projects[pi-1]];renderProjects();openCard(pi-1);}
function moveDown(pi){if(pi>=projects.length-1)return;[projects[pi],projects[pi+1]]=[projects[pi+1],projects[pi]];renderProjects();openCard(pi+1);}
function rmProject(pi){if(!confirm(`Remove "${projects[pi].title}"?`))return;projects.splice(pi,1);renderProjects();}
function addProject(){
  const title=prompt('Project title:');if(!title)return;
  const id=title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  projects.push({id,title,credits:[['EP of Post','Jacques del Conte']],films:[{provider:'vimeo',id:'',label:'',poster:''}],layout:'single'});
  renderProjects();const pi=projects.length-1;openCard(pi);document.getElementById(`pc${pi}`).scrollIntoView({behavior:'smooth'});
}

async function saveCurrentPage(){
  setStatus('Saving...','saving');document.getElementById('saveBtn').disabled=true;
  try{
    const newJS=serializeProjects(projects);
    const newHTML=currentHTML.replace(/const PROJECTS=\[[\s\S]*?\];\s*\ninitClientPage/,`const PROJECTS=${newJS};\ninitClientPage`);
    const enc=btoa(unescape(encodeURIComponent(newHTML)));
    const res=await ghPut(`/contents/${currentFile}`,{message:`Admin: update ${currentFile}`,content:enc,sha:currentSHA});
    if(res.content?.sha){currentSHA=res.content.sha;currentHTML=newHTML;setStatus('Saved','saved');toast('Saved! Deploying in ~30s');}
    else throw new Error(res.message||'Unknown error');
  }catch(e){setStatus('Error: '+e.message,'error');toast('Save failed: '+e.message,true);}
  document.getElementById('saveBtn').disabled=false;
}

function setStatus(msg,type){const el=document.getElementById('statusMsg');el.textContent=msg;el.className='status'+(type?' '+type:'');}
function toast(msg,isErr){const el=document.getElementById('toast');el.textContent=msg;el.className='toast show'+(isErr?' err':'');setTimeout(()=>el.className='toast',3500);}

window.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key==='s'){e.preventDefault();if(currentFile)saveCurrentPage();}
  if(e.key==='Enter'&&document.getElementById('login').style.display!=='none')doLogin();
});

const saved=localStorage.getItem('jdc_token');
if(saved)document.getElementById('tokenInput').value=saved;
</script>
</body>
